# SonarQube analysis, run by jenkins/sonar-scan.sh from the Jenkinsfile's
# SonarQube stage. The server address and the token are not here: they come
# from SONAR_HOST_URL (jenkins/jenkins.env, the Jenkins job or a build
# parameter) and from the SONAR_TOKEN credential. Project key and name below
# are the defaults of SONAR_PROJECT_KEY and SONAR_PROJECT_NAME.
#
# Run the scanner through jenkins/sonar-scan.sh, not directly: the script drops
# a source or test directory that does not exist yet (apps/web while the web app
# is being built), which the scanner itself would refuse. It reads the
# sonar.sources and sonar.tests lines of this file for that, so this file stays
# the one list of what is analysed.
sonar.projectKey=tabsira
sonar.projectName=TABSIRA
sonar.sourceEncoding=UTF-8

# What is analysed. apps/web is a source and a test directory at once, because
# its tests sit beside the code (*.test.ts, *.spec.ts) or under tests/ and e2e/;
# the inclusions and exclusions below tell the two apart. If the web app lays
# its tests out differently, change those patterns, not the directories.
sonar.sources=apps/api/src,services/vision/src,apps/web
sonar.tests=apps/api/tests,services/vision/tests,apps/web
sonar.test.inclusions=\
  apps/api/tests/**,\
  services/vision/tests/**,\
  apps/web/tests/**,\
  apps/web/e2e/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Not authored here: generated Alembic revisions, build output, dependencies,
# downloaded model weights, public assets and declaration files. Test files are
# excluded from the main set so apps/web is not counted twice.
sonar.exclusions=\
  apps/api/alembic/versions/**,\
  apps/api/alembic_geodata/versions/**,\
  services/vision/weights/**,\
  apps/web/public/**,\
  apps/web/tests/**,\
  apps/web/e2e/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/node_modules/**,\
  **/.venv/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.map,\
  **/*.d.ts

# Matches requires-python in apps/api/pyproject.toml and services/vision/pyproject.toml
sonar.python.version=3.12

# Coverage, read from what the suites have just written. The Python reports are
# Cobertura XML from pytest-cov; SonarQube's JavaScript analyzer reads lcov, not
# Cobertura, which is why the web suite writes both.
sonar.python.coverage.reportPaths=apps/api/coverage/coverage.xml,services/vision/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

# Generated migrations and configuration files hold no logic to cover.
sonar.coverage.exclusions=\
  apps/api/alembic/**,\
  apps/api/alembic_geodata/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.cjs
