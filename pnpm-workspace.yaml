# apps/web does not exist until the design gate is passed; a pattern that
# matches nothing is fine for pnpm and turbo.
packages:
  - apps/web
  - packages/*

# Advisories in transitive dependencies, each pinned within its own major so the
# package that depends on it keeps working. Remove an entry once the direct
# dependency has caught up on its own.
# The map library (decision 9) at its current release, which is younger than the
# minimum release age above; pinned exactly, and reviewed when it is bumped.
minimumReleaseAgeExclude:
  - maplibre-gl@6.12.0

overrides:
  # CPU exhaustion on merge keys (GHSA-r3ph-w7gj-g6xm), via markdownlint-cli.
  js-yaml@5: ^5.4.1
