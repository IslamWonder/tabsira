[project]
name = "tabsira-mockdata"
version = "0.1.0"
description = "Generates the mock members file (plan 23): references only, never scripture text"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faker>=40.41.0",
  "httpx>=0.28.1",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.13.5",
]

[dependency-groups]
# The process step (task 23.4) runs the real pipeline: apps/api's dependencies, with apps/api
# itself put on the path (it is not a package).
process = ["tabsira-api"]
dev = [
  { include-group = "process" },
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
]

[tool.uv.sources]
tabsira-api = { path = "../../apps/api", package = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockdata"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", ".pytest_cache", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ISC", "TCH", "ASYNC", "T10", "T20",
  "YTT", "PERF", "PIE", "S", "PL", "RET", "PTH", "LOG", "D", "ERA", "FIX", "C90", "Q", "SLF",
  "TRY", "EM", "RUF",
]
ignore = [
  "E501", "ISC001", "S101", "S603", "S607", "PLR2004", "PLR0913", "PLR0917", "FIX002", "FIX003",
  "TC001", "TC002", "TC003", "PLC0415", "D203", "D212",
  # Seeded pseudo-randomness is the point here: the output must repeat for a seed.
  "S311",
  # Summaries here describe what a function returns, not an order to give.
  "D401",
]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
# The command line prints its summary: that is its output.
"src/mockdata/cli.py" = ["T20"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "T20", "D", "SLF001", "EM", "TRY003", "PLC0415", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["mockdata"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The process step imports apps/api as a library (`src`); it is not a package.
pythonpath = ["../../apps/api"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["mockdata"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "pragma: no cover",
  # Entry-point guard of a module run with `python -m`; main() is tested.
  "if __name__ == .__main__.:",
  # A Protocol only describes a shape for the type checker; its body never runs.
  "class .*\\(Protocol\\):",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# apps/api is checked by its own configuration; here it is only read for its types.
mypy_path = "../../apps/api"

[[tool.mypy.overrides]]
module = ["src", "src.*"]
follow_imports = "silent"
