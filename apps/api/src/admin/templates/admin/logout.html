{#
  Signing out takes a POST with the CSRF token, so a link or an image on another page
  cannot do it; this page is the confirmation that holds the form.
#}
{% extends "sqladmin/layout.html" %}
{% block content %}
<div class="col-12 col-md-6">
  <div class="card">
    <div class="card-body">
      <h3 class="card-title">Sign out of the admin area?</h3>
      <form action="{{ url_for('admin:logout') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-primary">Sign out</button>
        <a href="{{ url_for('admin:index') }}" class="btn">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
