[project]
name = "tabsira-api"
version = "0.1.0"
description = "TABSIRA FastAPI backend"
requires-python = ">=3.12,<3.13"

dependencies = [
  # Web framework. starlette is imported directly (middleware, exceptions),
  # so it is declared here instead of being left to FastAPI's pin.
  "fastapi>=0.142.2",
  "starlette>=1.7.0",
  "uvicorn[standard]>=0.54.0",
  "gunicorn>=26.2.0",
  # Settings and validation
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  # ORM and database
  "sqlalchemy[asyncio]>=2.1.3",
  "asyncpg>=0.31.0",
  "psycopg[binary]>=3.3.6",
  "alembic>=1.20.0",
  "geoalchemy2>=0.20.0",
  "pgvector>=0.5.0",
  # HTTP client (provider adapters; the test client)
  "httpx>=0.28.1",
  # Fast JSON responses
  "orjson>=3.12.0",
  # Accounts: password hashing, verification of Google's signed ID tokens
  # (RS256, so PyJWT needs the crypto extra), and e-mail address validation.
  "bcrypt>=5.0.0",
  "pyjwt[crypto]>=2.15.1",
  "email-validator>=2.3.0",
  # Transactional mail templates, autoescaped (mail itself goes through smtplib).
  "jinja2>=3.1.6",
  # Reads the world ontology workbook (.xlsx); never writes one
  "openpyxl>=3.1.5",
  # Image checks before a photo reaches a model: format, size, EXIF orientation and GPS, metadata stripped
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "diff-cover>=10.6.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "types-openpyxl>=3.1.5",
  "hypothesis>=6.168.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "coverage",
  ".coverage",
  ".pytest_cache",
  "__pycache__",
  ".mypy_cache",
  ".ruff_cache",
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # Pyflakes (undefined names, unused imports)
  "I",     # isort (import sorting)
  "N",     # pep8-naming
  "UP",    # pyupgrade (modern Python syntax)
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "SIM",   # flake8-simplify
  "ISC",   # flake8-implicit-str-concat
  "TCH",   # flake8-type-checking
  "ASYNC", # flake8-async
  "T10",   # flake8-debugger (no pdb/set_trace)
  "T20",   # flake8-print (no print; use logging)
  "YTT",   # flake8-2020
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "S",     # flake8-bandit (security checks)
  "PL",    # pylint
  "RET",   # flake8-return
  "PTH",   # flake8-use-pathlib
  "LOG",   # flake8-logging
  "D",     # pydocstyle
  "ERA",   # eradicate (commented-out code)
  "FIX",   # flake8-fixme
  "C90",   # mccabe (cyclomatic complexity)
  "Q",     # flake8-quotes
  "SLF",   # flake8-self (private member access)
  "TRY",   # tryceratops
  "EM",    # flake8-errmsg
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E501",    # line-too-long (handled by the formatter)
  "ISC001",  # conflicts with the formatter
  "S101",    # assert is fine in tests
  "S603",    # subprocess with list args is safe in our scripts
  "S607",    # we intentionally call external commands in scripts
  "PLR2004", # magic value comparisons (too noisy with HTTP status codes)
  "PLR0913", # too many arguments (FastAPI endpoints naturally have many params)
  "PLR0917", # too many positional arguments (same reasoning)
  "FIX002",  # TODO comments are allowed during development
  "FIX003",  # FIXME comments are allowed during development
  "TC001",   # type-checking-only imports clash with SQLAlchemy and Pydantic at runtime
  "TC002",   # same, third-party
  "TC003",   # same, stdlib
  "PLC0415", # imports inside functions are fine for lazy loading
  "D203",    # incompatible with D211 (no-blank-line-before-class)
  "D212",    # incompatible with D213 (multi-line-summary-second-line)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports trigger unused-import warnings
"src/**/__init__.py" = ["F401", "F403", "F405"]
# Docstrings: not required on every module, class and function of the application code
"src/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]
# Tests use assert and fixtures with throwaway secrets, and build error messages inline
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "T20", "D", "SLF001", "EM", "TRY003", "PLC0415", "RUF012", "PLR0915"]
# Alembic migrations: docstring format is auto-generated; raw SQL is expected
"alembic/**/*.py" = ["D213", "D400", "D415", "S608", "Q003", "D103"]
"alembic_geodata/**/*.py" = ["D213", "D400", "D415", "S608", "Q003", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true
# SQLAlchemy's async layer runs on greenlets; without this their lines read as missed.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# The total stays at 100 %; scripts/test-coverage.sh also holds each change to it.
fail_under = 100
show_missing = true
# Each exclusion below has a reason; add a new one only with its reason.
exclude_lines = [
  # Explicit opt-out; the line carries its own reason.
  "pragma: no cover",
  # Entry-point guard of a module run with `python -m`; the function it calls is tested.
  "if __name__ == .__main__.:",
  # Imports evaluated by type checkers only; never runs.
  "if TYPE_CHECKING:",
  # Abstract and unreachable-by-design markers have no behaviour to test.
  "raise AssertionError",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.uv]
package = false
