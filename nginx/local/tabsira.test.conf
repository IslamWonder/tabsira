# TABSIRA: local development reverse proxy, plain HTTP on port 80 (decision 49).
#
#   http://tabsira.test       -> web  (Next.js)  127.0.0.1:3000
#   http://api.tabsira.test   -> API  (FastAPI)  127.0.0.1:8000, no admin here
#   http://admin.tabsira.test -> the same API, /admin only (production: admin.tabsira.me, VPN only)
#
# Installed by scripts/setup-nginx-local.sh, which also adds the three names to
# /etc/hosts and runs `nginx -t` before every reload. Development only: production
# is nginx/production/tabsira.me.conf, https with HSTS.
#
# No TLS here, so no certificate, no HSTS and no redirect to https; the API sets
# its cookies without the Secure flag when SITE_URL is http (config.py).
#
# This file shares an nginx with other sites, so every name it declares carries
# the tabsira_ prefix and it never sets a default_server. Every server listens on
# the same sockets (*:80 and [::]:80): nginx picks the listen socket before the
# server name, so a block bound to 127.0.0.1 alone would catch every loopback
# request whatever its host.
#
# A location that sets a header with add_header drops every header inherited
# from the server block. If one is added here, repeat the security headers in it.

map $http_upgrade $tabsira_connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Web: http://tabsira.test ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tabsira.test;

    # No CSP here: Next.js in development needs inline scripts and a websocket.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.web.access.log;
    error_log  /var/log/nginx/tabsira.web.error.log;

    # Everything goes to Next.js, including its hot-reload websocket.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $tabsira_connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 3600s;
    }
}

# ─── API: http://api.tabsira.test ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.tabsira.test;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    # Keep in step with the API's maximum image size: nginx answering 413 for a
    # photo the API would have accepted gives the visitor no useful message.
    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.api.access.log;
    error_log  /var/log/nginx/tabsira.api.error.log;

    # Scan progress, GET /scans/{id}/events: server-sent events. Buffering would
    # hold every message until the stream closed.
    location ~ ^/scans/[^/]+/events$ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
    }

    # Like production: the admin area is not served on the API host.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}

# ─── Admin: http://admin.tabsira.test ───────────────────────────────
# Production serves this host over the VPN only; locally it answers this
# machine only (allow loopback, deny all), the same second guard. It listens on
# the shared sockets, not on 127.0.0.1 alone: see the note at the top.
server {
    listen 80;
    listen [::]:80;
    server_name admin.tabsira.test;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    add_header Cache-Control           "no-store" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "same-origin" always;
    add_header X-Robots-Tag            "noindex, nofollow" always;

    client_max_body_size 1m;

    access_log /var/log/nginx/tabsira.admin.access.log;
    error_log  /var/log/nginx/tabsira.admin.error.log;

    location = / {
        return 302 /admin/;
    }

    location /admin {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;

        add_header Cache-Control           "no-store" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "same-origin" always;
        add_header X-Robots-Tag            "noindex, nofollow" always;
    }

    location / {
        return 404;
    }
}
