# TABSIRA: local development reverse proxy, HTTPS by mkcert.
#
#   https://tabsira.test      -> web  (Next.js)  127.0.0.1:3000
#   https://api.tabsira.test  -> API  (FastAPI)  127.0.0.1:8000, no admin here
#   https://admin.tabsira.test -> the same API, /admin only (production: admin.tabsira.me, VPN only)
#
# Installed by scripts/setup-nginx-local.sh, which also creates the mkcert
# certificate, adds the three names to /etc/hosts and runs `nginx -t` before every
# reload. Development only: production is nginx/production/tabsira.me.conf.
#
# This file shares an nginx with other sites, so every name it declares carries
# the tabsira_ prefix and it never sets a default_server.
#
# A location that sets a header with add_header drops every header inherited
# from the server block. If one is added here, repeat the security headers in it.

map $http_upgrade $tabsira_connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP -> HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tabsira.test api.tabsira.test admin.tabsira.test;

    return 301 https://$host$request_uri;
}

# ─── Web: https://tabsira.test ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tabsira.test;

    ssl_certificate     /etc/nginx/certs/tabsira.test.pem;
    ssl_certificate_key /etc/nginx/certs/tabsira.test-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # No HSTS and no CSP here: a browser would remember HSTS for the .test name,
    # and Next.js in development needs inline scripts and a websocket.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.web.access.log;
    error_log  /var/log/nginx/tabsira.web.error.log;

    # Everything goes to Next.js, including its hot-reload websocket.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $tabsira_connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 3600s;
    }
}

# ─── API: https://api.tabsira.test ──────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tabsira.test;

    ssl_certificate     /etc/nginx/certs/tabsira.test.pem;
    ssl_certificate_key /etc/nginx/certs/tabsira.test-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    # Keep in step with the API's maximum image size: nginx answering 413 for a
    # photo the API would have accepted gives the visitor no useful message.
    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.api.access.log;
    error_log  /var/log/nginx/tabsira.api.error.log;

    # Scan progress, GET /scans/{id}/events: server-sent events. Buffering would
    # hold every message until the stream closed.
    location ~ ^/scans/[^/]+/events$ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 3600s;
    }

    # Like production: the admin area is not served on the API host.
    location ^~ /admin {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}

# ─── Admin: https://admin.tabsira.test ──────────────────────────────
# Production serves this host over the VPN only; locally it answers this
# machine only (allow 127.0.0.1, deny all), the same second guard.
server {
    listen 127.0.0.1:443 ssl http2;
    server_name admin.tabsira.test;
    allow 127.0.0.1;
    deny  all;

    ssl_certificate     /etc/nginx/certs/tabsira.test.pem;
    ssl_certificate_key /etc/nginx/certs/tabsira.test-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Cache-Control           "no-store" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "same-origin" always;
    add_header X-Robots-Tag            "noindex, nofollow" always;

    client_max_body_size 1m;

    access_log /var/log/nginx/tabsira.admin.access.log;
    error_log  /var/log/nginx/tabsira.admin.error.log;

    location = / {
        return 302 /admin/;
    }

    location /admin {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_read_timeout 120s;

        add_header Cache-Control           "no-store" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header Referrer-Policy         "same-origin" always;
        add_header X-Robots-Tag            "noindex, nofollow" always;
    }

    location / {
        return 404;
    }
}
