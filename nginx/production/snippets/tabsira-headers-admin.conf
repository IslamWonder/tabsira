# Security headers of https://admin.tabsira.me (docs/ADMIN.md, "Headers"):
# never cached, never framed. Included in the server block and in every
# location that sets a header of its own. Installed to /etc/nginx/snippets/
# by deploy/apply-config.sh. The API sets the same headers itself; nginx
# repeats them so a 404 or a 502 page carries them too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cache-Control             "no-store" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
# same-origin, not no-referrer: with no-referrer a browser sends `Origin: null`
# on every form post and the API's origin check refuses it.
add_header Referrer-Policy           "same-origin" always;
add_header X-Robots-Tag              "noindex, nofollow" always;
add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
