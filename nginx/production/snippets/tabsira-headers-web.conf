# Security headers of https://tabsira.me. Included in the server block AND in
# every location that sets a header of its own: nginx drops the headers a
# server block sets as soon as a location uses add_header (AGENTS.md, lessons).
# Installed to /etc/nginx/snippets/ by deploy/apply-config.sh.
#
# The visitor's browser makes no third-party request, with these exceptions:
#   - the map: MapLibre reads its style, glyphs, sprites and vector tiles from
#     tiles.openfreemap.org and runs its tile workers from blob: URLs;
#   - Google Analytics 4 and Microsoft Clarity, which the web app injects only
#     after the visitor accepts their cookie category (decisions 28 and 32);
#   - Cloudflare Turnstile (script and challenge frame from challenges.cloudflare.com),
#     loaded only on the sign-up, sign-in, account-mail and support forms (decision 56).
#   - the mock members' photos, images from placepix.net (decision 66).
# 'unsafe-inline' for scripts is what the Next.js bootstrap and the consent
# snippet need until a nonce-aware middleware replaces it. Photos are served
# through the API host; add the storage origin to img-src if a bucket serves
# them directly (S3_PUBLIC_BASE_URL).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy    "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.tabsira.me https://tiles.openfreemap.org https://placepix.net https://www.google-analytics.com https://*.google-analytics.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com; font-src 'self' data:; connect-src 'self' https://api.tabsira.me https://tiles.openfreemap.org https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; manifest-src 'self'; upgrade-insecure-requests" always;
