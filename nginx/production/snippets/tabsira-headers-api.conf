# Security headers of https://api.tabsira.me (JSON, the server-sent events and
# the sqladmin pages at /admin, which load only what the API itself serves).
# Included in the server block and in every location that sets a header of
# its own. Installed to /etc/nginx/snippets/ by deploy/apply-config.sh.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag              "noindex, nofollow" always;
add_header Content-Security-Policy   "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
