# TABSIRA: production nginx site.
#
#   https://tabsira.me       -> web  (Next.js under pm2, cluster mode)   127.0.0.1:3000
#   https://api.tabsira.me   -> API  (FastAPI under gunicorn + uvicorn)  127.0.0.1:8000
#   https://admin.tabsira.me -> the same API, path /admin only, reachable over the
#                               Netbird VPN only (no public DNS record, no public listener)
#   https://www.tabsira.me   -> 301 to https://tabsira.me
#
# Tracked here and installed by deploy/apply-config.sh, which runs `nginx -t`
# before every reload and restores the previous files when the test fails.
# Nothing host-specific lives in this file:
#
#   TLS      /etc/nginx/snippets/tabsira-tls.conf defines ssl_certificate and
#            ssl_certificate_key (generated: certbot's paths). The certificate
#            must cover tabsira.me, www.tabsira.me and api.tabsira.me.
#   Admin    /etc/nginx/snippets/tabsira-admin-listen.conf (generated: the
#            listen line on the app host's VPN address, allow <VPN subnet>,
#            deny all) and tabsira-admin-tls.conf (its own certificate, issued
#            by a DNS challenge because the host is not publicly reachable).
#   Headers  snippets/tabsira-headers-web.conf, -api.conf and -admin.conf.
#            They are INCLUDED in every location that sets a header with
#            add_header, because such a location drops every header inherited
#            from the server block. When you add a location that uses
#            add_header, include the snippet in it.
#   Static   @APP_ROOT@/static (/opt/tabsira/static) holds the /_next/static files of every recent
#            build, so a tab opened before a deploy still finds its old chunks.
#   Upstreams  below. A rolling deploy needs no nginx change: pm2 reloads the
#            web instances one at a time behind port 3000 and gunicorn replaces
#            its workers one at a time behind port 8000. nginx rides over the
#            swap with proxy_next_upstream.

upstream tabsira_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tabsira_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Sign-in and the admin form: a slow, shared budget per client address.
limit_req_zone $binary_remote_addr zone=tabsira_admin:10m rate=10r/s;
# The admin sign-in form: a password guess every two seconds per address, a short burst.
limit_req_zone $binary_remote_addr zone=tabsira_login:10m rate=30r/m;
# The open POST routes anyone can reach (sign-in, sign-up, support, consent,
# browser error reports). The API rate-limits too; this stops the flood before Python.
limit_req_zone $binary_remote_addr zone=tabsira_open:10m rate=2r/s;
# The share card of a published insight, GET /insights/{id}/card: the web app
# draws a PNG for anyone, so the draws are metered before Node.
limit_req_zone $binary_remote_addr zone=tabsira_card:10m rate=2r/s;
limit_req_status 429;

# The bare domain is the only canonical host: one hop from www, from http and
# https alike.
map $host $tabsira_https_host {
    www.tabsira.me tabsira.me;
    default        $host;
}

# ─── HTTP -> HTTPS (and the certificate challenge) ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tabsira.me www.tabsira.me api.tabsira.me;

    # certbot's webroot challenge. No add_header here, so nothing to repeat.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$tabsira_https_host$request_uri;
    }
}

# ─── www -> bare domain ─────────────────────────────────────────────
server {
    # `http2` in the listen line, not `http2 on;`: that directive exists only
    # from nginx 1.25.1 and Ubuntu 24.04 ships 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/tabsira-headers-web.conf;

    return 301 https://tabsira.me$request_uri;
}

# ─── Web: https://tabsira.me ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tabsira_ssl:10m;
    ssl_session_timeout 1d;
    # No OCSP stapling: Let's Encrypt certificates carry no OCSP responder any more.

    include /etc/nginx/snippets/tabsira-headers-web.conf;

    # A little above the API's largest photo (IMAGE_MAX_BYTES, 15 MiB), for the
    # multipart framing: nginx answering 413 for a photo the API would have
    # accepted gives the visitor no useful message.
    client_max_body_size 16m;

    access_log /var/log/nginx/tabsira.web.access.log;
    error_log  /var/log/nginx/tabsira.web.error.log;

    # Build output: content-hashed names, kept across deploys on disk, so the
    # files are served by nginx, never by Node. A file not found (the very
    # first request after a deploy, before the copy) falls through to the web app.
    location /_next/static/ {
        root @APP_ROOT@/static;
        try_files $uri @tabsira_web;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/tabsira-headers-web.conf;
    }

    # The service worker script is never served from a cache, or a fixed bug
    # would stay in installed copies of the PWA.
    location = /sw.js {
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/tabsira-headers-web.conf;
    }

    # The share card is drawn at each request for anyone: its own, small budget
    # per address. A location that sets a header drops the inherited ones, so
    # the security headers are included here too.
    location ~ ^/insights/[0-9]+/card$ {
        limit_req zone=tabsira_card burst=10 nodelay;
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout       3s;
        proxy_read_timeout          30s;

        include /etc/nginx/snippets/tabsira-headers-web.conf;
    }

    location @tabsira_web {
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # A request that lands on an instance mid-reload is retried on another
        # try (idempotent methods only, the default).
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_connect_timeout       3s;
        proxy_read_timeout          60s;
    }
}

# ─── API: https://api.tabsira.me (no admin here) ────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tabsira_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/tabsira-headers-api.conf;

    client_max_body_size 16m;
    # A photo over a mobile connection is slow; do not cut it off at the default.
    client_body_timeout 60s;

    access_log /var/log/nginx/tabsira.api.access.log;
    error_log  /var/log/nginx/tabsira.api.error.log;

    # Scan progress, GET /scans/{id}/events: server-sent events. Buffering would
    # hold every message until the stream closed. No retry: a half-sent stream
    # cannot be replayed on another instance.
    location ~ ^/scans/[^/]+/events$ {
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_next_upstream off;
        proxy_read_timeout 3600s;
    }

    # The open POST routes. A POST is never retried on another worker.
    location ~ ^/(auth/login|auth/signup|support|consent|client-errors)$ {
        limit_req zone=tabsira_open burst=10 nodelay;
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout       3s;
        proxy_read_timeout          120s;

        include /etc/nginx/snippets/tabsira-headers-api.conf;
    }

    # The admin area is served only at https://admin.tabsira.me, over the VPN
    # (server block below). Here it does not exist: 404 for /admin and
    # everything under it, whatever the API would answer. Exact and prefix match
    # both, so /admin and /admin/ and /admin/x are all covered.
    location ^~ /admin {
        return 404;
    }

    # Photos: nginx caches none and serves none; the API answers them (signed
    # links for private ones). Keep `Cache-Control: public, max-age=300` on the
    # public/ prefix of the bucket or CDN (S3_PUBLIC_BASE_URL), never longer:
    # a photo its owner withdraws must stop being served within minutes.

    location / {
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # A request that lands on a worker mid-replacement is retried
        # (idempotent methods only, the default).
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_connect_timeout       3s;
        proxy_read_timeout          120s;
    }
}

# ─── Admin: https://admin.tabsira.me (VPN only) ─────────────────────
# Not a public host. There is no public DNS record: Netbird's DNS (split DNS)
# resolves admin.tabsira.me to this host's VPN address. nginx listens on that
# address only and refuses every client outside the VPN subnet a second time.
server {
    # listen <app host VPN address>:443 ssl http2; allow <VPN subnet>; deny all;
    include /etc/nginx/snippets/tabsira-admin-listen.conf;
    server_name admin.tabsira.me;

    include /etc/nginx/snippets/tabsira-admin-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tabsira_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/tabsira-headers-admin.conf;

    client_max_body_size 1m;

    access_log /var/log/nginx/tabsira.admin.access.log;
    error_log  /var/log/nginx/tabsira.admin.error.log;

    # The area lives under /admin; the bare address goes there.
    location = / {
        return 302 /admin/;
    }

    # The sign-in form, the strictest budget. Exact match, so it wins over /admin.
    location = /admin/login {
        limit_req zone=tabsira_login burst=5 nodelay;
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        # Host stays admin.tabsira.me: the API refuses /admin on any other host.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout       3s;
        proxy_read_timeout          120s;

        include /etc/nginx/snippets/tabsira-headers-admin.conf;
    }

    location /admin {
        limit_req zone=tabsira_admin burst=20 nodelay;
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_connect_timeout       3s;
        proxy_read_timeout          120s;

        include /etc/nginx/snippets/tabsira-headers-admin.conf;
    }

    # Nothing else is served on this host.
    location / {
        return 404;
    }
}
