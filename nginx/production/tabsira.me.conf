# TABSIRA: production nginx site.
#
#   https://tabsira.me       -> web  (Next.js under pm2, cluster mode)   127.0.0.1:3000
#   https://api.tabsira.me   -> API  (FastAPI under gunicorn + uvicorn)  127.0.0.1:8000
#                               the admin area is api.tabsira.me/admin
#   https://www.tabsira.me   -> 301 to https://tabsira.me
#
# Tracked here and copied to /etc/nginx/sites-available/ by the deploy tooling,
# which runs `nginx -t` before every reload and restores the previous file when
# the test fails. Nothing host-specific lives in this file:
#
#   TLS      /etc/nginx/snippets/tabsira-tls.conf defines ssl_certificate and
#            ssl_certificate_key, because the paths depend on how the host gets
#            its certificate. The certificate must cover tabsira.me,
#            www.tabsira.me and api.tabsira.me.
#
#   Upstreams  below. A rolling deploy needs no nginx change: pm2 reloads the web
#            instances one at a time behind port 3000, and gunicorn replaces its
#            workers one at a time behind port 8000. nginx rides over the swap
#            with proxy_next_upstream; to run a second API copy on another port,
#            add a `server` line to the upstream.
#
# The security headers are repeated in every location that sets a header with
# add_header, because such a location drops every header inherited from the
# server block. When you add a location that uses add_header, copy them in.

upstream tabsira_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tabsira_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# The bare domain is the only canonical host: one hop from www, from http and
# https alike.
map $host $tabsira_https_host {
    www.tabsira.me tabsira.me;
    default        $host;
}

# ─── HTTP -> HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tabsira.me www.tabsira.me api.tabsira.me;

    location / {
        return 301 https://$tabsira_https_host$request_uri;
    }
}

# ─── www -> bare domain ─────────────────────────────────────────────
server {
    # `http2` in the listen line, not `http2 on;`: that directive exists only
    # from nginx 1.25.1 and Ubuntu 24.04 ships 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://tabsira.me$request_uri;
}

# ─── Web: https://tabsira.me ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tabsira_ssl:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;

    # The visitor's browser makes no third-party request. The one exception is
    # the map: MapLibre reads its style, glyphs, sprites and vector tiles from
    # tiles.openfreemap.org and runs its tile workers from blob: URLs (named in
    # the terms page). Fonts are served from this origin. 'unsafe-inline' for
    # scripts is what the Next.js bootstrap needs until a nonce-aware middleware
    # replaces it. Photos are served through the API host; add the storage
    # origin to img-src when a bucket serves them directly.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.tabsira.me https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://api.tabsira.me https://tiles.openfreemap.org; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;

    # Keep in step with the API's maximum image size: nginx answering 413 for a
    # photo the API would have accepted gives the visitor no useful message.
    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.web.access.log;
    error_log  /var/log/nginx/tabsira.web.error.log;

    # The service worker script is never served from a cache, or a fixed bug
    # would stay in installed copies of the PWA. (Rename if the web app's
    # worker file has another name.)
    location = /sw.js {
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Cache-Control             "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.tabsira.me https://tiles.openfreemap.org; font-src 'self' data:; connect-src 'self' https://api.tabsira.me https://tiles.openfreemap.org; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    }

    location / {
        proxy_pass         http://tabsira_web;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # A request that lands on an instance mid-reload is retried on another
        # try (idempotent methods only, the default).
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_connect_timeout       3s;
        proxy_read_timeout          60s;
    }
}

# ─── API: https://api.tabsira.me (admin at /admin) ──────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tabsira.me;

    include /etc/nginx/snippets/tabsira-tls.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tabsira_ssl:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag              "noindex, nofollow" always;
    # JSON and the sqladmin pages, which load only what the API itself serves.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    client_max_body_size 15m;

    access_log /var/log/nginx/tabsira.api.access.log;
    error_log  /var/log/nginx/tabsira.api.error.log;

    # Scan progress, GET /scans/{id}/events: server-sent events. Buffering would
    # hold every message until the stream closed. No retry: a half-sent stream
    # cannot be replayed on another instance.
    location ~ ^/scans/[^/]+/events$ {
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_next_upstream off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://tabsira_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # A request that lands on a worker mid-replacement is retried
        # (idempotent methods only, the default).
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   3;
        proxy_connect_timeout       3s;
        proxy_read_timeout          120s;
    }
}
